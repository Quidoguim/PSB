<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Grafo de chamadas entre as sete funcoes do subconjunto estudado de sort.c: sort() chama fillbuf(), que chama maybe_growbuf() -> try_growbuf() e pre-computa a primeira chave via begfield()/limfield(); compare() chama keycompare(), que reusa os mesmos begfield()/limfield() para as chaves seguintes.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #000000; }
    .fn rect { fill: #ffffff; stroke: #000000; stroke-width: 1.6; }
    .fn text { font-size: 13px; text-anchor: middle; }
    .ext rect { fill: #ffffff; stroke: #000000; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ext text { font-size: 11px; text-anchor: middle; }
    .edge { stroke: #000000; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    .lbl { font-size: 10.5px; fill: #333333; }
  </style>

  <!-- external callers, outside the studied subset -->
  <g class="ext">
    <rect x="50" y="16" width="280" height="42"/>
    <text x="190" y="33">chamado por main()</text>
    <text x="190" y="47">(fora do subconjunto)</text>
  </g>
  <g class="ext">
    <rect x="560" y="16" width="300" height="42"/>
    <text x="710" y="33">chamado por sortlines()/sequential_sort()</text>
    <text x="710" y="47">(fora do subconjunto)</text>
  </g>

  <!-- subset functions -->
  <g class="fn"><rect x="140" y="98" width="140" height="40"/><text x="210" y="123">sort()</text></g>
  <g class="fn"><rect x="650" y="98" width="140" height="40"/><text x="720" y="123">compare()</text></g>

  <g class="fn"><rect x="140" y="178" width="140" height="40"/><text x="210" y="203">fillbuf()</text></g>
  <g class="fn"><rect x="650" y="178" width="140" height="40"/><text x="720" y="203">keycompare()</text></g>

  <g class="fn"><rect x="28" y="258" width="174" height="40"/><text x="115" y="283">maybe_growbuf()</text></g>
  <g class="fn"><rect x="330" y="258" width="130" height="40"/><text x="395" y="283">begfield()</text></g>
  <g class="fn"><rect x="480" y="258" width="130" height="40"/><text x="545" y="283">limfield()</text></g>

  <g class="fn"><rect x="28" y="338" width="174" height="40"/><text x="115" y="363">try_growbuf()</text></g>

  <!-- edges -->
  <path class="edge" d="M190,58 L208,98"/>
  <path class="edge" d="M710,58 L719,98"/>

  <path class="edge" d="M210,138 L210,178"/>
  <text class="lbl" x="216" y="161">chama</text>

  <path class="edge" d="M720,138 L720,178"/>
  <text class="lbl" x="726" y="161">chama</text>

  <path class="edge" d="M172,218 L128,258"/>
  <text class="lbl" x="100" y="242">chama</text>

  <path class="edge" d="M210,218 L370,258"/>
  <path class="edge" d="M212,218 L520,258"/>
  <text class="lbl" x="256" y="233">pré-computa 1ª chave (-k)</text>

  <path class="edge" d="M115,298 L115,338"/>
  <text class="lbl" x="121" y="321">chama</text>

  <path class="edge" d="M688,218 L420,258"/>
  <path class="edge" d="M690,218 L562,258"/>
  <text class="lbl" x="612" y="233">chaves seguintes (-k)</text>
</svg>
